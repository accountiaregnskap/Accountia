baseURL = "https://acountia.no/"
languageCode = "nb-no"
title = "Accountia"

# Language setup
defaultContentLanguage = "no"
defaultContentLanguageInSubdir = false

[params]
googleReviews = "https://share.google/DmBF0pQuhFFlW6j54"
siteName = "Accountia"
description = "Regnskapstjenester og økonomisk rådgivning for bedrifter. Effektivt, trygt og tilgjengelig."
ogImage = "/images/accountia-share.jpg"
phone = "+47 48342461"
      whatsapp = "https://wa.me/4748342461"
email = "info@acountia.no"
address = "Kvernhusmyrane 1, 5914 Isdalstø"
orgnr = "936 229 239"
openhours = "Åpent 08:00–16:00 (man–fre)"

[[module.mounts]]
  source = "content"
  target = "content"
  files = ["! ar/**", "! en/**", "! es/**"]
  [module.mounts.sites.matrix]
    languages = ["no"]

[[module.mounts]]
  source = "content/en"
  target = "content"
  [module.mounts.sites.matrix]
    languages = ["en"]

[[module.mounts]]
  source = "content/es"
  target = "content"
  [module.mounts.sites.matrix]
    languages = ["es"]

[[module.mounts]]
  source = "content/ar"
  target = "content"
  [module.mounts.sites.matrix]
    languages = ["ar"]

[[module.mounts]]
  source = "data"
  target = "data"

[[module.mounts]]
  source = "i18n"
  target = "i18n"

[[module.mounts]]
  source = "layouts"
  target = "layouts"

[[module.mounts]]
  source = "static"
  target = "static"

