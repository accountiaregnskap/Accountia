<div class="catalog-controls" hidden>
  <label><span>{{ .search }}</span><input type="search" autocomplete="off" maxlength="100" placeholder="{{ .placeholder }}"></label>
  <div class="catalog-view" role="group" aria-label="{{ .view }}">
    <button type="button" aria-pressed="true" data-view="cards">{{ .cards }}</button>
    <button type="button" aria-pressed="false" data-view="list">{{ .list }}</button>
  </div>
</div>
<p class="catalog-count" role="status" data-count="{{ .count }}" hidden></p>
<p class="catalog-empty" hidden>{{ .empty }}</p>
