<a class="skip-content" href="#main-content">{{ i18n "skip_content" }}</a>
<header class="brandbar">
  <div class="brandbar-inner">
    <a class="brandbar-logo" href="{{ "/" | relLangURL }}" aria-label="Accountia">
      {{ partial "brandmark.html" . }}
    </a>
    <nav class="brandbar-nav brandbar-desktop" aria-label="{{ i18n "primary_navigation" }}">
      {{ partial "brandbar-links.html" . }}
    </nav>
    <details class="brandbar-menu">
      <summary class="brandbar-trigger" aria-controls="primary-menu">
        <span class="brandbar-burger" aria-hidden="true"><span></span><span></span><span></span></span>
        <span>{{ i18n "menu" }}</span>
      </summary>
      <nav class="brandbar-nav brandbar-drawer" id="primary-menu" aria-label="{{ i18n "primary_navigation" }}">
        {{ partial "brandbar-links.html" . }}
      </nav>
    </details>
  </div>
</header>
