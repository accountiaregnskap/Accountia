<section class="front-intro">
  <div class="container front-layout">
    <div class="front-copy">
      <p class="front-kicker">{{ i18n "studio_kicker" }}</p>
      <h1>{{ .Params.hero_title }}</h1>
      <p class="front-lead">{{ .Params.hero_lead }}</p>
      <div class="front-actions">
        <a class="action-main" href="{{ .Params.hero_cta_primary_url }}">{{ .Params.hero_cta_primary_label }} <span aria-hidden="true">→</span></a>
        <a class="action-link" href="#service-guide">{{ i18n "guide_title" }} <span aria-hidden="true">↓</span></a>
      </div>
      <a class="front-review" href="{{ site.Params.googleReviews }}">{{ i18n "google_reviews" }} <span aria-hidden="true">↗</span></a>
    </div>
    <div class="front-photo">
      <img src="/images/accountia-skrivebord.jpg"
           srcset="/images/accountia-skrivebord-mobil.jpg 630w, /images/accountia-skrivebord.jpg 1260w"
           sizes="(max-width: 760px) calc(100vw - 36px), (max-width: 1260px) 47vw, 570px"
           width="1260" height="840" alt="" fetchpriority="high">
    </div>
  </div>
</section>
