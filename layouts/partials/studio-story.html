<section class="studio-story" aria-labelledby="studio-story-title" data-reveal>
  <figure class="studio-person">
    <img src="/images/accountia-portrait-full.jpg" width="599" height="1236" alt="Ayham Layous" loading="lazy" decoding="async">
  </figure>
  <div class="studio-story-copy">
    <h2 id="studio-story-title">{{ i18n "studio_story_title" }}</h2>
    <p>{{ i18n "studio_story_text" }}</p>
    <a href="{{ i18n "studio_story_url" }}">{{ i18n "studio_story_link" }}</a>
  </div>
</section>
