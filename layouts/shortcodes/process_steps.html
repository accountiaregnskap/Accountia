<section class="journey" data-reveal>
  <header class="journey-head">
    <h2>{{ .Get "title" }}</h2>
    <p>{{ .Get "lead" }}</p>
  </header>
  <ol class="journey-steps" role="list">
    {{ range (slice 1 2 3 4) }}
      {{ $title := printf "s%dt" . }}
      {{ $text := printf "s%dd" . }}
      {{ $icon := printf "s%di" . }}
      <li>
        {{ with $.Get $icon }}<span class="journey-icon"><img src="/images/icons/{{ . }}.svg" alt="" width="24" height="24"></span>{{ end }}
        <h3>{{ $.Get $title }}</h3>
        <p>{{ $.Get $text }}</p>
      </li>
    {{ end }}
  </ol>
</section>
