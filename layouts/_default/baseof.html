<!doctype html>
<html lang="{{ .Site.Language.Lang }}" dir="{{ if eq .Site.Language.Lang "ar" }}rtl{{ else }}ltr{{ end }}">
  <head>
    {{ partial "head.html" . }}
  </head>

  <body class="{{ .Kind }} {{ .Type }} {{ .Layout }}">
    {{ partial "header.html" . }}

    <main class="site-main">
      {{ block "main" . }}{{ end }}
    </main>

    {{ partial "footer.html" . }}
    {{ partial "customer-help.html" . }}

    {{ $script := resources.FromString "js/accountia.js" (readFile "static/js/site.js") | minify | fingerprint }}
    <script src="{{ $script.RelPermalink }}" integrity="{{ $script.Data.Integrity }}" defer></script>

  </body>
</html>
