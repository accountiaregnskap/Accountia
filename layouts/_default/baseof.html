<!doctype html>
<html lang="{{ .Site.Language.Lang }}" dir="{{ if eq .Site.Language.Lang "ar" }}rtl{{ else }}ltr{{ end }}">
  <head>
    {{ partial "head.html" . }}
  </head>

  <body class="{{ .Kind }} {{ .Type }} {{ .Layout }}">
    {{ partial "header.html" . }}

    <main class="site-main">
      {{ block "main" . }}{{ end }}
    </main>

    {{ partial "footer.html" . }}
    {{ partial "customer-help.html" . }}

    <script src="{{ "js/site.js" | relURL }}" defer></script>

  </body>
</html>
