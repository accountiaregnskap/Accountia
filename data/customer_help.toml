[no]
label = "Spør Accountia"
intro = "Skriv et spørsmål om priser, tjenester eller oppstart."
placeholder = "Skriv spørsmålet ditt"
send = "Send"
unknown = "Jeg fant ikke et sikkert svar i informasjonen vår. Kontakt oss, så hjelper vi deg videre."
close = "Lukk hjelpen"
contact = "Kontakt oss"
contact_url = "/kontakt/#contact-form"
[[no.questions]]
question = "Hvordan får jeg et pristilbud?"
keywords = ["pris","priser","kostnad","koster","pristilbud","tilbud","prisen"]
answer = "Fortell litt om bedriften og hva du trenger. Vi vurderer omfanget og gir deg et gratis, tilpasset pristilbud."
link = "Les om priser"
url = "/priser/"
[[no.questions]]
question = "Kan dere hjelpe meg å bytte regnskapsfører?"
keywords = ["bytte","bytter","skifte","skifter","ny regnskapsfører","ny regnskapsforer","endre regnskapsfører"]
answer = "Ja. Vi planlegger overgangen med deg og avklarer hva som må overføres, ansvar og frister."
[[no.questions]]
question = "Hva kan dere hjelpe bedriften min med?"
keywords = ["tjenester","tilbyr"]
answer = "Vi hjelper med regnskap, lønn og A-melding, MVA, årsoppgjør og økonomisk rådgivning."
link = "Se tjenester"
url = "/tjenester/"
[[no.questions]]
question = "Hvilke språk finnes på nettsiden?"
keywords = ["språk","engelsk","norsk","arabisk","spansk"]
answer = "Nettsiden finnes på norsk, engelsk, spansk og arabisk. Bruk språkvelgeren i menyen."
[[no.questions]]
question = "Hvor holder dere til?"
answer = "Du finner oss på Kvernhusmyrane 1, 5914 Isdalstø, ved AMFI Knarvik."
link = "Adresse og kontakt"
url = "/kontakt/"
keywords = ["adresse","knarvik","isdalstø","ligger","besøke","sted","parkering"]
[[no.questions]]
question = "Hvordan får jeg tak i dere?"
answer = "Ring 483 42 461, send e-post til info@acountia.no eller bruk kontaktskjemaet. Du finner de oppgitte åpningstidene på kontaktsiden."
link = "Kontakt oss"
url = "/kontakt/#contact-form"
keywords = ["kontakt","telefon","nummer","ring","epost","e post","mail","åpningstid","åpningstider","åpent"]
[[no.questions]]
question = "Kan dere ta lønn og A-melding?"
answer = "Vi hjelper med lønnskjøring og A-melding, fra oppsett til løpende rapportering."
link = "Les om lønn"
url = "/tjenester/lonn/"
keywords = ["lønn","lonn","lønnskjøring","a melding","amelding","lønninger","ansatte"]
[[no.questions]]
question = "Kan dere hjelpe med MVA og årsoppgjør?"
answer = "Vi hjelper med løpende bokføring, MVA-rapportering og årsoppgjør. Fortell oss hvordan dere jobber i dag, så avklarer vi hva dere trenger."
link = "Les om regnskap"
url = "/tjenester/regnskap/"
keywords = ["mva","merverdiavgift","moms","årsoppgjør","skattemelding","bokføring","regnskap"]
[[no.questions]]
question = "Hvilke regnskapssystemer bruker dere?"
answer = "Vi jobber i blant annet Tripletex, PowerOffice, UniMicro og Fiken."
link = "Les om regnskap"
url = "/tjenester/regnskap/"
keywords = ["system","systemer","regnskapssystem","tripletex","poweroffice","unimicro","fiken"]
[[no.questions]]
question = "Kan dere overta økonomifunksjonen?"
answer = "Vi kan avlaste hele eller deler av økonomifunksjonen, avhengig av hva bedriften trenger."
link = "Les om outsourcing"
url = "/tjenester/outsourcing/"
keywords = ["outsourcing","utkontraktering","økonomifunksjon","økonomifunksjonen","avlaste"]

[en]
label = "Ask Accountia"
intro = "Ask a question about pricing, services or getting started."
placeholder = "Type your question"
send = "Send"
unknown = "I couldn’t find a reliable answer in our information. Contact us and we’ll help."
close = "Close help"
contact = "Contact us"
contact_url = "/en/contact/#contact-form"
[[en.questions]]
question = "How do I get a quote?"
keywords = ["price","pricing","cost","costs","fee","quote","estimate","charge","how much"]
answer = "Tell us a little about your business and what you need. We’ll assess the scope and provide a free, tailored quote."
link = "Read about pricing"
url = "/en/prices/"
[[en.questions]]
question = "Can you help me switch accountants?"
keywords = ["switch","switching","change accountants","new accountant","transfer"]
answer = "Yes. We’ll plan the transition with you and agree what needs to be transferred, responsibilities and deadlines."
[[en.questions]]
question = "What can you help my business with?"
keywords = ["services","service","offer"]
answer = "We help with bookkeeping, payroll and reporting, VAT, annual accounts and financial advice."
link = "View services"
url = "/en/services/"
[[en.questions]]
question = "Which languages is the website available in?"
keywords = ["language","languages","norwegian","english","arabic","spanish"]
answer = "The website is available in Norwegian, English, Spanish and Arabic. Use the language selector in the menu."
[[en.questions]]
question = "Where are you based?"
answer = "Our office is at Kvernhusmyrane 1, 5914 Isdalstø, by AMFI Knarvik."
link = "Address and contact"
url = "/en/contact/"
keywords = ["where are you","location","address","knarvik","isdalsto","office","visit"]
[[en.questions]]
question = "How can I contact you?"
answer = "Call +47 483 42 461, email info@acountia.no or use our contact form. Our opening hours are on the contact page."
link = "Contact us"
url = "/en/contact/#contact-form"
keywords = ["contact","phone","call","number","email","opening","hours","open"]
[[en.questions]]
question = "Can you handle payroll?"
answer = "We help with payroll and A-melding reporting, from the initial setup to regular reports."
link = "Read about payroll"
url = "/en/services/payroll/"
keywords = ["payroll","salary","wages","payslip","employees","a melding"]
[[en.questions]]
question = "Can you help with VAT and annual accounts?"
answer = "We can help with bookkeeping, VAT reporting and annual accounts. Tell us how your business works today so we can assess what you need."
link = "Read about bookkeeping"
url = "/en/services/bookkeeping/"
keywords = ["vat","tax","bookkeeping","annual accounts","annual reporting","accounting"]
[[en.questions]]
question = "Which accounting systems do you use?"
answer = "We work with systems including Tripletex, PowerOffice, UniMicro and Fiken."
link = "Read about bookkeeping"
url = "/en/services/bookkeeping/"
keywords = ["software","systems","system","tripletex","poweroffice","unimicro","fiken"]
[[en.questions]]
question = "Can you take over our finance function?"
answer = "We can support part or all of your finance function, depending on what your business needs."
link = "Read about outsourcing"
url = "/en/services/outsourcing/"
keywords = ["outsourcing","outsource","finance function","external"]

